<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte & Fourneaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header with tabs (bottom bar on phones), one column of working blocks, bottom sheet for details and pickers */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f5f6f9; --ink:#151922; --muted:#5a6173; --line:#dadee7; --body:#d6dae3;
  --accent:#1d4ed8; --accent-soft:#e4eaff; --on-accent:#ffffff;
  --plate-red:#cf3434; --plate-yellow:#c98d00; --plate-green:#1c8a4d;
  --good:#1c8a4d; --warn:#b97400; --bad:#c43030; --scrim:rgba(15,18,24,.45); --skin:#ece6e0; --muscle:#d9d0c7; --bm-line:#b9aea3; --hl:#e4512b; --hl2:#f2a58c;
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c25; --surface2:#1f2430; --ink:#e8ebf2; --muted:#9aa2b3; --line:#2b3140; --body:#2f3646;
  --accent:#7393ff; --accent-soft:#1f2a4d; --on-accent:#0a0f1f;
  --plate-red:#f06b6b; --plate-yellow:#f0bd3a; --plate-green:#4cc584;
  --good:#4cc584; --warn:#f0bd3a; --bad:#f06b6b; --scrim:rgba(0,0,0,.6); --skin:#3b3f4a; --muscle:#4b505d; --bm-line:#1f232c; --hl:#ff6a3d; --hl2:#a8553e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --surface2:#1f2430; --ink:#e8ebf2; --muted:#9aa2b3; --line:#2b3140; --body:#2f3646;
  --accent:#7393ff; --accent-soft:#1f2a4d; --on-accent:#0a0f1f;
  --plate-red:#f06b6b; --plate-yellow:#f0bd3a; --plate-green:#4cc584;
  --good:#4cc584; --warn:#f0bd3a; --bad:#f06b6b; --scrim:rgba(0,0,0,.6); --skin:#3b3f4a; --muscle:#4b505d; --bm-line:#1f232c; --hl:#ff6a3d; --hl2:#a8553e; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
p{margin:0}
.num,input[type=number]{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em;white-space:nowrap}
.mark{width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 22%,var(--accent) 23% 62%,var(--ink) 63% 100%)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.ok::before{background:var(--good)} .sync.err::before{background:var(--bad)}
nav.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;position:relative}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--plate-red)}

.app{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-courses{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead p{max-width:62ch}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface2);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.rest90{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.rest120{background:color-mix(in srgb,var(--plate-red) 14%,transparent);color:var(--plate-red)}
.pill.rest60{background:color-mix(in srgb,var(--plate-green) 14%,transparent);color:var(--plate-green)}
.pill.ai{background:color-mix(in srgb,var(--plate-yellow) 18%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--plate-yellow) 18%,transparent);color:var(--warn)}
.banner{border:1px dashed var(--warn);background:color-mix(in srgb,var(--plate-yellow) 9%,var(--surface));border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}

/* Programme */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.day h3{display:flex;align-items:baseline;gap:8px}
.day .idx{font-family:var(--f-display);color:var(--muted);font-size:1rem}
.warm{background:var(--surface2);border-radius:8px;padding:9px 11px;font-size:.88rem;margin-block:10px}
.exlist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.exlist .linkbtn{font-weight:500}
.sr{font-family:var(--f-display);font-size:1.05rem;font-weight:600;white-space:nowrap}
.next{outline:2px solid var(--accent);outline-offset:-1px}
.edit-ex{display:grid;grid-template-columns:minmax(0,1fr) 50px 66px 70px 30px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.edit-ex input,.edit-ex select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);min-width:0}
.edit-ex .namebtn{text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-head{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:0}

/* Séance */
.live-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.clock{font-family:var(--f-display);font-size:2rem;font-weight:700}
.ex-card h3{font-size:1.25rem}
.ex-card h3 .linkbtn{font-family:var(--f-display);font-size:1.3rem}
.hint{font-size:.82rem;color:var(--good);font-weight:600}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:4px}
.sets td{padding:4px;border-top:1px solid var(--line)}
.sets td.n{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:36px}
.sets td.prev{color:var(--muted);font-size:.85rem;white-space:nowrap}
.sets input{width:100%;max-width:96px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);font-size:1rem}
.sets tr.done td{background:color-mix(in srgb,var(--good) 10%,transparent)}
.sets tr.done input{background:transparent;border-color:transparent;font-weight:700}
.check{width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.check svg{width:18px;height:18px;stroke:var(--muted)}
tr.done .check{background:var(--good);border-color:var(--good)}
tr.done .check svg{stroke:var(--surface)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.note{width:100%;margin-top:8px;padding:7px 9px;border:1px dashed var(--line);border-radius:7px;background:transparent;font-size:.88rem}
.progressbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progressbar i{display:block;height:100%;background:var(--good)}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:min(460px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer .t{font-family:var(--f-display);font-size:2rem;font-weight:700;min-width:84px}
.timer .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:7px;padding:5px 8px;cursor:pointer;font-weight:600;font-size:.8rem}
.timer.over{background:var(--good)}

/* Feuille (détails, sélecteur) */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-card{position:relative;background:var(--surface);border-radius:16px;width:min(640px,100%);max-height:min(88vh,860px);overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-x{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;z-index:2}
.bodymap{width:100%;max-width:300px;height:auto;display:block;margin:4px auto 0}
.bodymap text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.exoimg{display:block;width:100%;max-height:320px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.imgdrop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface2)}
.thumb{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none;cursor:pointer}
.howto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.legend{display:flex;gap:12px;justify-content:center;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.picklist{list-style:none;margin:10px 0 0;padding:0}
.picklist li{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line)}
.pick{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pick:hover b{color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:4px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:1rem}
.done-hero{text-align:center;padding-block:6px 4px}
.done-hero h2{font-size:2rem}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.statgrid div{background:var(--surface);padding:10px}
.statgrid b{display:block;font-family:var(--f-display);font-size:1.4rem}

/* Recettes */
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.targets div{background:var(--surface);padding:10px 12px}
.targets b{display:block;font-family:var(--f-display);font-size:1.5rem}
.planner .prow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.planner .prow.off .dsel,.planner .prow.off .stepper{opacity:.35;pointer-events:none}
.dsel{display:flex;gap:4px;flex-wrap:wrap}
.dsel button{width:38px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:.8rem}
.dsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stepper b{font-family:var(--f-display);font-size:1.3rem;min-width:18px;text-align:center}
.split{font-size:.78rem;color:var(--muted)}
.meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.meal .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.macros{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted);margin-block:6px}
.macros b{color:var(--ink);font-weight:700}
details summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.9rem;margin-top:6px}
.ing{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line);font-size:.9rem}
.ing li span:last-child{white-space:nowrap;font-weight:600}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.adjust{margin-top:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:8px;padding:10px}
.adjust textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);resize:vertical;min-height:56px}
.daybar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daybar .chip{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:6px 12px;min-width:62px}
.daybar .chip small{font-weight:500;font-size:.7rem;opacity:.75}
.dayrows{list-style:none;margin:0;padding:0}
.dayrows li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dayrows .t{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.daytotal{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent)}

/* Courses */
.shop-group h3{font-size:1.05rem;margin:14px 0 4px;color:var(--muted)}
.shop{list-style:none;margin:0;padding:0}
.shop li label{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop li input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.shop li .q{margin-left:auto;font-weight:700;white-space:nowrap}
.shop li.got span{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.chat{display:flex;flex-direction:column;gap:10px;height:min(640px,75vh)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.chat form{display:flex;gap:8px}
.chat textarea{flex:1;min-width:0;resize:none;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);height:46px}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.copybox{width:100%;height:160px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:.85rem}

/* Suivi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:2.2rem;line-height:1}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.kpi.goal-ok b{color:var(--good)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.heat{display:grid;grid-template-columns:28px repeat(12,minmax(0,1fr));gap:3px;max-width:520px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--surface2);max-width:100%}
.heat span.on{background:var(--accent)}
.heat span.today{outline:2px solid var(--ink);outline-offset:-2px}
.heat em{font-style:normal;font-size:.68rem;color:var(--muted);align-self:center}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line)}
.hist button.h{display:flex;gap:10px;align-items:center;width:100%;padding:10px 2px;background:none;border:0;cursor:pointer;text-align:left}
.hist button.h:hover b{color:var(--accent)}
.hist .d{font-family:var(--f-display);font-weight:700;width:70px;flex:none}
.hist .grow{flex:1;min-width:0}
.hist .chev{color:var(--muted)}
.tablewrap{overflow-x:auto}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}

}

function setSync(s){const el=$('#sync');el.className='sync '+(s==='ok'?'ok':s==='err'?'err':'');el.textContent=s==='ok'?'Sauvegardé':s==='err'?'Erreur de sauvegarde':s==='load'?'Chargement…':s==='saving'?'Enregistrement…':PWA?'Hors ligne OK':'Sur cet appareil'}
function saveLocal(){try{localStorage.setItem('ff-state',JSON.stringify(state));localStorage.setItem('ff-stamps',JSON.stringify(stamps))}catch(e){}}
const timers={},writing={};
function persist(...docs){const now=Date.now();docs.forEach(d=>stamps[d]=now);saveLocal();if(!db)return;setSync('saving');for(const d of docs){clearTimeout(timers[d]);timers[d]=setTimeout(()=>{delete timers[d];writeDoc(d)},400)}}
function flush(){Object.keys(timers).forEach(d=>{clearTimeout(timers[d]);delete timers[d];writeDoc(d)})}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
async function writeDoc(d){
  if(!db)return;
  if(writing[d]){writing[d]='again';return}
  writing[d]=true;
  try{const data={updatedAt:stamps[d]||Date.now()};DOCS[d].forEach(k=>{if(state[k]!==null&&state[k]!==undefined)data[k]=clone(state[k])});await db.doc(`data/users/${uid}/${d}`).set(data);if(!Object.keys(timers).length)setSync('ok')}catch(e){console.warn(e);setSync('err');toast("Sauvegarde impossible : "+(e?.message||e?.code||'erreur'))}
  const again=writing[d]==='again';writing[d]=false;if(again)writeDoc(d);
}
async function initCloud(){
  if(!window.claude||!claude.use){setSync('local');return}
  setSync('load');
  const guard=setTimeout(()=>setSync('local'),10000);
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u){clearTimeout(guard);setSync('local');return}
    uid=await u.id();
    const snap=await d.collection(`data/users/${uid}`).get();
    clearTimeout(guard);db=d;
    /* Pour chaque document : on garde la version la plus récente (celle de cet appareil si elle n'a pas encore été envoyée). */
    const push=new Set(Object.keys(DOCS).filter(k=>stamps[k]));
    snap.docs.forEach(doc=>{if(!DOCS[doc.id])return;const v=doc.data()||{};const remote=+v.updatedAt||0;
      if((stamps[doc.id]||0)>remote)return;
      push.delete(doc.id);stamps[doc.id]=remote;DOCS[doc.id].forEach(k=>{state[k]=v[k]!==undefined?v[k]:(k==='v'?1:DEF()[k])})});
    const oldV=state.v;migrate();
    if(oldV!==state.v)Object.keys(DOCS).forEach(k=>push.add(k));
    push.forEach(k=>writeDoc(k));
    setSync('ok');saveLocal();ensureWeek();render();
  }catch(e){clearTimeout(guard);console.warn(e);setSync('local')}
}

function pool(type){const s=season(),dis=dislikes();return RECIPES.filter(r=>r.type===type&&(r.seasons.includes(s)||r.seasons.includes('all'))&&!dis.some(w=>norm(r.name+' '+r.ing.map(i=>i[0]).join(' ')).includes(norm(w))))}
function chunks(list,n){const out=[];let i=0;for(let k=0;k<n;k++){const size=Math.ceil((list.length-i)/(n-k));out.push(list.slice(i,i+size));i+=size}return out.filter(g=>g.length)}
function slots(){const out=[];typesOn().forEach(t=>{const P=state.plan[t];const D=P.days.map((v,i)=>v?i:-1).filter(i=>i>=0);const n=Math.max(1,Math.min(P.n,D.length));chunks(D,n).forEach(g=>out.push({type:t,days:g}))});return out}
function genWeek(next,silent){
  const lists={},usedIds={};
  const dishes=slots().map(s=>{
    if(!lists[s.type]){let p=pool(s.type);if(!p.length)p=RECIPES.filter(r=>r.type===s.type);lists[s.type]=shuffle(p);usedIds[s.type]=new Set()}
    const list=lists[s.type],used=usedIds[s.type];
    const span=s.days[s.days.length-1]-s.days[0]+1;
    const pick=list.find(r=>!used.has(r.id)&&(s.days.length<2||r.keep===0||r.keep>=span||r.frz))||list.find(r=>!used.has(r.id))||list[used.size%list.length];
    used.add(pick.id);
    return {uid:uidg(),type:s.type,days:s.days,recipe:clone(pick)}});
  state.week={key:next?nextWeekKey():weekKey(),season:season(),source:'Bibliothèque',dishes};resetShop();
  if(silent)saveLocal();else persist('meals');
}
function resetShop(){state.shop.checked={};state.shop.removed={};state.shop.deleted=null}
function ensureWeek(){if(!state.week||!state.week.dishes)genWeek(false,true)}
function share(type){const on=typesOn();const sum=on.reduce((a,t)=>a+MEAL_W[t],0)||1;return MEAL_W[type]/sum}
function dishFactor(d){const r=d.recipe;if(!r.kcal)return 1;const f=share(d.type)*targets().kcal/r.kcal;return Math.min(2.2,Math.max(.6,Math.round(f*20)/20))}
function dishesOn(i){return (state.week?.dishes||[]).filter(d=>d.days.includes(i))}
function dayTotals(i){const t={kcal:0,p:0,g:0,l:0};dishesOn(i).forEach(d=>{const f=dishFactor(d);['kcal','p','g','l'].forEach(k=>t[k]+=(+d.recipe[k]||0)*f)});return t}
function keepInfo(d){const r=d.recipe;if(r.keep===0)return{txt:'Préparé au moment',cls:''};if(d.days.length<2)return{txt:`Se garde ${r.keep} j`,cls:''};const span=d.days[d.days.length-1]-d.days[0]+1;if(span<=r.keep)return{txt:`Se garde ${r.keep} j au frigo`,cls:'good'};return r.frz?{txt:`Congèle les portions au-delà de ${r.keep} j`,cls:'warn'}:{txt:`Ne se garde que ${r.keep} j : cuisine en 2 fois`,cls:'warn'}}
function fmtQ(q,u,shop){if(!q)return u?'':'à avoir';if(u==='g'||u==='ml'){const r=q>=100?Math.round(q/10)*10:Math.round(q/5)*5||Math.round(q);return r>=1000?fr(r/1000,2)+(u==='g'?' kg':' L'):r+' '+u}const r=shop?Math.ceil(q-0.05):Math.round(q*2)/2;return fr(r,1)+(u==='pièce'?'':' '+u+(r>1&&!u.endsWith('s')?'s':''))}
function daysLabel(days){if(days.length===7)return 'tous les jours';const c=days.every((d,i)=>!i||d===days[i-1]+1);return c&&days.length>2?`${DAYS[days[0]].slice(0,3).toLowerCase()}. → ${DAYS[days[days.length-1]].slice(0,3).toLowerCase()}.`:days.map(i=>DAYS[i].slice(0,3).toLowerCase()+'.').join(', ')}
function normRecipe(o,type){
  if(!o||typeof o!=='object')throw new Error('recette vide');
  const ing=(o.ing||o.ingredients||[]).map(i=>Array.isArray(i)?[String(i[0]),+i[1]||0,String(i[2]||''),RAYONS[i[3]]?i[3]:'E']:[String(i.nom||i.name||''),+(i.qte??i.qty)||0,String(i.unite??i.unit??''),RAYONS[i.rayon]?i.rayon:'E']).filter(i=>i[0]);
  const keep=o.conservation!==undefined?Math.max(0,Math.round(+o.conservation||0)):(type==='b'||type==='s'?0:3);
  const r={id:'ai-'+uidg(),type,name:String(o.name||o.nom||'Recette'),seasons:[season()],time:+o.time||+o.temps||20,kcal:Math.round(+o.kcal||0),p:Math.round(+o.p||+o.proteines||0),g:Math.round(+o.g||+o.glucides||0),l:Math.round(+o.l||+o.lipides||0),keep,frz:!!o.congelable,ing,steps:(o.steps||o.etapes||[]).map(String).slice(0,8),ai:true};
  if(!r.kcal||!ing.length)throw new Error('recette incomplète (kcal ou ingrédients manquants)');
  return r;
}

const IDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('ff-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('img',mode);const out=fn(t.objectStore('img'));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},del(k){return this.tx('readwrite',s=>s.delete(k))},
  async all(){const d=await this.open();return new Promise((res,rej)=>{const out={};const rq=d.transaction('img').objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}};

function weekCounts(n){const out=[];const m=monday(new Date());for(let i=n-1;i>=0;i--){const d=new Date(m);d.setDate(d.getDate()-7*i);const k=iso(d);out.push({k,label:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}),c:state.sessions.filter(s=>weekKey(parseD(s.date))===k).length})}return out}
function streak(){const g=weekGoal();const w=weekCounts(52);let s=0;let i=w.length-1;if(w[i].c<g)i--;for(;i>=0&&w[i].c>=g;i--)s++;return s}
function barChart(w,goal){const W=600,H=190,L=28,B=26,T=10,max=Math.max(goal+1,...w.map(x=>x.c)),bw=(W-L-8)/w.length;const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine">`;
  for(let v=0;v<=max;v++)s+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  w.forEach((x,i)=>{const h=H-B-y(x.c),cx=L+i*bw+bw*.18;s+=`<rect x="${cx}" y="${y(x.c)}" width="${bw*.64}" height="${Math.max(0,h)}" rx="3" fill="${x.c>=goal?'var(--accent)':'var(--muted)'}" opacity="${x.c>=goal?1:.45}"/>`;if(i%2===(w.length-1)%2)s+=`<text x="${cx+bw*.32}" y="${H-8}" text-anchor="middle">${i===w.length-1?'Cette sem.':x.label}</text>`});
  s+=`<line x1="${L}" x2="${W-4}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4"/><text x="${W-6}" y="${y(goal)-5}" text-anchor="end" style="fill:var(--good);font-weight:600">objectif ${goal}</text></svg>`;return s}
function lineChart(pts,unit){if(pts.length<2)return `<p class="small muted">Il faut au moins 2 séances pour tracer une courbe.</p>`;const W=600,H=200,L=44,B=26,T=16,R=14;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);const padv=(mx-mn)*.15||Math.max(1,mx*.05);mn-=padv;mx+=padv;const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progression">`;
  for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fr(v,v<20?1:0)}</text>`}
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  s+=`<path d="${d} L${x(pts.length-1)},${H-B} L${L},${H-B}Z" fill="var(--accent)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.y)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`});
  const lp=pts[pts.length-1];s+=`<text x="${x(pts.length-1)-8}" y="${y(lp.y)-10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fr(lp.y,1)} ${unit}</text>`;
  [0,pts.length-1].forEach(i=>s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i?'end':'start'}">${fmtD(pts[i].d)}</text>`);return s+'</svg>'}
function vSuivi(){

  const sets=(ses.ex||[]).reduce((a,e)=>a+e.sets.length,0),vol=(ses.ex||[]).reduce((a,e)=>a+e.sets.reduce((b,t)=>b+(+t.kg||0)*(+t.reps||0),0),0);
  const wc=state.sessions.filter(z=>weekKey(parseD(z.date))===weekKey()).length;
  return `<div class="stack"><div class="done-hero"><div class="eyebrow">Séance terminée · ${esc(ses.dayName)}</div><h2>${esc(s.msg)}</h2><p class="small muted">Enregistrée automatiquement dans ton suivi.</p></div>
    <div class="statgrid num"><div><span class="eyebrow">Durée</span><b>${Math.round((ses.dur||0)/60000)} min</b></div><div><span class="eyebrow">Séries</span><b>${sets}</b></div><div><span class="eyebrow">Volume</span><b>${vol>=1000?fr(vol/1000,1)+' t':fr(vol)+' kg'}</b></div><div><span class="eyebrow">Cette semaine</span><b>${wc} / ${weekGoal()}</b></div></div>
    ${s.prs.length?`<div><h3>Records battus</h3><ul class="hist">${s.prs.map(p=>`<li style="padding:8px 0"><span class="pill good">Record</span> <b>${esc(p.n)}</b> <span class="small muted num">${esc(p.txt)}</span></li>`).join('')}</ul></div>`:''}
    ${s.changed?`<div class="banner info"><span class="small">Tu as changé des exercices pendant la séance. Les garder dans ton programme ?</span><button class="btn sm primary" data-a="updateTpl">Mettre à jour le programme</button></div>`:''}
    <div class="row between"><button class="btn" data-a="sessOpen" data-id="${s.id}">Corriger la séance</button><button class="btn primary" data-a="goSuivi">Voir le suivi</button></div></div>`;
}

/* ================= Minuteur ================= */
function startTimer(sec,label){clearInterval(startTimer.iv);const end=Date.now()+sec*1000;const el=$('#timer');el.hidden=false;let beeped=false;
  const tick=()=>{const left=Math.round((end-Date.now())/1000);const a=Math.abs(left);el.className='timer'+(left<=0?' over':'');el.innerHTML=`<span class="t num">${left<0?'+':''}${Math.floor(a/60)}:${pad(a%60)}</span><div style="flex:1;min-width:0"><div class="tiny" style="opacity:.8;margin-bottom:4px">${left>0?'Repos · '+esc(label):'Série suivante !'}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,(1-left/sec)*100))}%"></i></div></div><button data-a="tplus">+15 s</button><button data-a="tstop">OK</button>`;
    if(left<=0&&!beeped){beeped=true;beep()}if(left<-60)stopTimer()};
  startTimer.end=end;startTimer.label=label;tick();startTimer.iv=setInterval(tick,500)}
function stopTimer(){clearInterval(startTimer.iv);$('#timer').hidden=true}
let AC;function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[0,.3].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.16)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
setInterval(()=>{const c=$('#clock');if(c&&state.current){const s=Math.floor((Date.now()-state.current.start)/1000);c.textContent=`${Math.floor(s/60)}:${pad(s%60)}`}},1000);

/* ================= Séance : fin ================= */
const DONE_MSG=['Bien joué, séance validée.','Une de plus au compteur.','Propre. Récupère bien.','Séance bouclée, beau travail.',"Régulier, c'est comme ça qu'on progresse."];
function finishSession(auto){
  const c=state.current;if(!c)return;
  const ex=c.ex.map(e=>({n:e.n,r:e.r,note:e.note||'',sets:e.sets.filter(s=>s.done||(!auto&&s.kg!==''&&s.reps!=='')).map(s=>({kg:s.kg===''?'':+s.kg,reps:s.reps===''?'':+s.reps,done:!!s.done}))})).filter(e=>e.sets.length);
  if(!ex.length&&!auto){toast('Valide au moins une série, ou abandonne la séance.');return}
  const prs=[];ex.forEach(e=>{const prev=historyFor(e.n);if(!prev.length)return;const pb=Math.max(...prev.flatMap(h=>h.sets.map(t=>e1rm(t.kg,t.reps))));const pk=Math.max(...prev.flatMap(h=>h.sets.map(t=>+t.kg||0)));const nb=bestOf(e.sets);const nk=Math.max(...e.sets.map(t=>+t.kg||0));
    if(nk>pk)prs.push({n:e.n,txt:`Charge max ${fr(nk,1)} kg (avant ${fr(pk,1)} kg)`});else if(nb.r>pb+0.05)prs.push({n:e.n,txt:`1RM estimé ${fr(nb.r,1)} kg (+${fr(nb.r-pb,1)})`})});
  const sess={id:c.id,date:today(),program:c.program,dayIdx:c.dayIdx,dayName:c.dayName,warmup:c.warmup,dur:Date.now()-c.start,ex};
  state.sessions.push(sess);
  const tpl=state.programs[c.program]?.days[c.dayIdx];
  const changed=!!tpl&&JSON.stringify(tpl.ex.map(e=>e.n))!==JSON.stringify(c.ex.map(e=>e.n));
  ui.tplUpdate=changed?{program:c.program,day:c.dayIdx,ex:c.ex.map(e=>({n:e.n,s:e.sets.length,r:e.r,rest:e.rest}))}:null;
  state.current=null;ui.confirmCancel=false;stopTimer();persist('log');
  ui.sheet={type:'done',id:sess.id,msg:DONE_MSG[Math.floor(Math.random()*DONE_MSG.length)],prs,changed};
  scrollTo(0,0);render();
}

async function aiDish(u,instruction){

    const prompt=instruction
      ?`Voici une recette de mon menu musculation :\n${JSON.stringify(toAIRecipe(d.recipe))}\n${ctx}\nModifie-la selon ma demande : « ${instruction} ». Garde des macros proches pour une portion (sauf si la demande dit le contraire). Au plus 8 ingrédients et 4 étapes courtes.\n${RAYON_HELP}\nRéponds uniquement avec la recette complète en JSON, de cette forme : ${RECIPE_SHAPE}`
      :`Propose UNE nouvelle recette de ${MEAL_LABEL[d.type].toLowerCase()} pour un pratiquant de musculation, différente de : ${[...new Set(others.concat(d.recipe.name))].join(' ; ')}.\n${ctx}\nVise environ ${d.recipe.kcal} kcal et beaucoup de protéines pour UNE portion. Ingrédients de supermarché français, au plus 8 ingrédients, 4 étapes courtes, ≤ 35 min.\n${RAYON_HELP}\nRéponds uniquement avec un objet JSON de cette forme : ${RECIPE_SHAPE}`;
    const o=await s.json(prompt,{cache:false});
    d.recipe=normRecipe(o,d.type);state.week.source='Bibliothèque + IA';persist('meals');ui.adjust=null;ui.adjustText='';toast(instruction?'Recette modifiée':'Nouvelle recette : '+d.recipe.name)}catch(e){toast(aiError(e))}
  ui.busy[u]=false;rerenderKeep();
}

async function sendChat(text){
  text=String(text||'').trim();if(!text||ui.busy.chat)return;
  const s=await getSample();
  state.chat=state.chat||[];state.chat.push({role:'user',content:text});
  if(!s){state.chat.push({role:'assistant',content:"Je ne suis disponible que dans l'appli publiée sur claude.ai."});render();return}
  ui.busy.chat=true;ui.changed=false;render();
  const intro={role:'user',content:`Tu es l'assistant repas de l'appli « Fonte & Fourneaux » (musculation). Réponds en français, de façon brève et concrète.\n${profileText()}\nUtilise lire_menu pour connaître les plats. Quand l'utilisateur veut changer ou améliorer une recette, propose une alternative de saison qui respecte son objectif et la durée de conservation nécessaire, puis appelle directement remplacer_plat avec la recette complète (macros pour une portion de base, l'appli ajuste les portions). S'il veut changer ses calories ou ses aliments à éviter, utilise modifier_profil. Ensuite, dis en une ou deux phrases ce que tu as changé. Pas de markdown, pas de titres.`};
  try{
    const res=await s([intro,...state.chat.slice(-16)],{cache:false,tools:CHAT_TOOLS,onText:({text})=>{const el=$('#streaming');if(el)el.textContent=text;const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}});
    state.chat.push({role:'assistant',content:res.text||"C'est fait."});
  }catch(e){state.chat.push({role:'assistant',content:aiError(e)})}
  state.chat=state.chat.slice(-30);ui.busy.chat=false;persist('meals');render();
  if(ui.changed)toast('Menu et liste de courses mis à jour');
}

  unRmAll(){state.shop.removed={};persist('meals');rerenderKeep()},
  deleteList(){const s=state.shop;s.deleted={at:today(),snap:{checked:s.checked,extras:s.extras,removed:s.removed}};s.checked={};s.extras=[];s.removed={};persist('meals');render();toast('Liste supprimée. Tu peux la restaurer.')},
  restoreList(){const s=state.shop,snap=s.deleted?.snap||{};s.checked=snap.checked||{};s.extras=snap.extras||[];s.removed=snap.removed||{};s.deleted=null;persist('meals');render();toast('Liste restaurée')},
  freshList(){resetShop();state.shop.extras=[];persist('meals');render();toast('Nouvelle liste créée')},
  delExtra(a){state.shop.extras=state.shop.extras.filter(x=>x.id!==a.dataset.id);persist('meals');render()},
  copy(){const t=shopText();try{navigator.clipboard.writeText(t).then(()=>toast('Liste copiée'),()=>{ui.copyText=t;render()})}catch(e){ui.copyText=t;render()}},
  clearChat(){state.chat=[];persist('meals');render()},
  ask(a){sendChat(a.dataset.q)}
};

/* ================= Événements ================= */
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const f=A[a.dataset.a];if(!f)return;if(a.type==='checkbox'){f(a);return}e.preventDefault();f(a,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.ex!==undefined&&state.current){const s=state.current.ex[+t.dataset.ex].sets[+t.dataset.set];s[t.dataset.f]=t.value===''?'':+t.value;persist('log')}
  if(t.dataset.note!==undefined&&state.current){state.current.ex[+t.dataset.note].note=t.value;persist('log')}
  if(t.id==='pickq'){ui.sheet.q=t.value;$('#pickList').innerHTML=pickList()}
  if(t.dataset.se&&ui.sheet?.type==='sess'){const[i,j,f]=t.dataset.se.split('|');const s=state.sessions.find(x=>x.id===ui.sheet.id);s.ex[+i].sets[+j][f]=t.value===''?'':+t.value;persist('log')}
  if(t.id&&t.id.startsWith('adj-'))ui.adjustText=t.value;
  if(t.dataset.p&&t.tagName!=='SELECT'){const p=state.profile;p[t.dataset.p]=t.type==='number'&&t.value!==''?+t.value:t.value;p.edited=true;persist('profile')}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='exoFile'){const f=t.files&&t.files[0];t.value='';if(f)uploadExoImg(f);return}
  if(t.id==='importFile'){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(txt=>{const o=JSON.parse(txt);if(!o||o.app!=='fonte-fourneaux'||!o.state)throw 0;ui.pendingImport={state:o.state,when:new Date(o.exported).toLocaleDateString('fr-FR')};location.hash='profil';render()}).catch(()=>toast("Ce fichier n'est pas une sauvegarde Fonte & Fourneaux."));return}
  if(t.dataset.p){const p=state.profile;p[t.dataset.p]=t.type==='number'&&t.value!==''?+t.value:t.value;p.edited=true;persist('profile');rerenderKeep();toast('Enregistré')}
  if(t.dataset.pe){const[i,j,f]=t.dataset.pe.split('|');const d=prog().days[+i];if(j==='name')d.name=t.value;else{const ex=d.ex[+j];ex[f]=f==='s'||f==='rest'?+t.value:t.value}persist('profile')}
  if(t.id==='exsel'){ui.exSel=t.value;rerenderKeep()}
  if(t.id==='pickeq'){ui.sheet.eq=t.value;$('#pickList').innerHTML=pickList()}
  if(t.dataset.sd&&ui.sheet?.type==='sess'){const s=state.sessions.find(x=>x.id===ui.sheet.id);if(t.value){s.date=t.value;persist('log')}}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='chat'){const t=$('#chatin');const v=t.value;t.value='';sendChat(v)}
  if(f==='adjust'){const u=e.target.dataset.u;const v=($(`#adj-${u}`)?.value||'').trim();if(!v){toast('Écris ce que tu veux changer.');return}aiDish(u,v)}
  if(f==='extra'){const v=$('#extra').value.trim();if(v){state.shop.extras.push({id:uidg(),n:v});persist('meals');render()}}
  if(f==='weight'){const kg=+$('#wkg').value,d=$('#wdate').value||today();if(kg>0){state.weights=state.weights.filter(x=>x.d!==d);state.weights.push({d,kg});const last=[...state.weights].sort((a,b)=>a.d<b.d?-1:1).pop();state.profile.weight=last.kg;persist('log','profile');render();toast('Pesée enregistrée, portions recalculées')}}
  if(f==='manual'){const d=$('#mdate').value||today(),i=+$('#mday').value;state.sessions.push({id:uidg(),date:d,program:state.activeProgram,dayIdx:i>=0?i:null,dayName:i>=0?prog().days[i].name:'Autre activité',manual:true,ex:[]});persist('log');render();toast('Séance ajoutée')}
});
document.addEventListener('keydown',e=>{if(e.target.id==='chatin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}if(e.key==='Escape'&&ui.sheet)A.closeSheet()});
document.addEventListener('paste',e=>{if(ui.sheet?.type!=='exo')return;const f=[...(e.clipboardData?.files||[])].find(x=>/^image\//.test(x.type));if(f){e.preventDefault();uploadExoImg(f)}});
addEventListener('hashchange',()=>{ui.sheet=null;render();scrollTo(0,0)});

ensureWeek();render();
if(PWA){loadLocalImgs();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installEvt=e;if(current()==='profil')render()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initCloud);else initCloud();
</script>
